# The /usr filesystem, read-only and verity protected.
#
# squashfs rather than erofs: this kernel has CONFIG_EROFS_FS without
# EROFS_FS_ZIP_ZSTD, so an erofs image compressed with zstd would not mount.
# Being deterministic is what makes delta updates cheap later.
#
# Only /usr is copied. /etc and /var come from a partition systemd-repart
# creates on the device at first boot.
#
# Fixed at 2G rather than minimized, matching the empty B slot: an update is
# written into whichever slot is inactive, so both must fit the largest image
# ever shipped. 2G is the ceiling; raising it later means reflashing.

[Partition]
Type=usr
Format=squashfs
CopyFiles=/usr:/
Verity=data
VerityMatchKey=usr
SizeMinBytes=2G
SizeMaxBytes=2G
Compression=zstd
