# The root filesystem.
#
# ext4, because it is what Ubuntu and NVIDIA both assume, and because the
# NVIDIA tooling that a later update mechanism would have to work with expects
# it.
#
# The size is fixed rather than minimised. mkosi's default is to shrink the
# partition to just fit its contents, which makes the smallest possible image
# file but leaves a system with no room to write a log. Eight gigabytes gives
# the built image (around five) a couple of gigabytes of working space.
#
# Note what this does not do: it does not grow to fill the disk it is written
# to. A 1 TB SSD written with this image has an 8 GB root filesystem and a lot
# of unallocated space after it. Claiming that space belongs with the work on
# how images are installed and updated, which is deliberately out of scope here;
# see the README.

[Partition]
Type=root
Format=ext4
CopyFiles=/
SizeMinBytes=8G
SizeMaxBytes=8G
