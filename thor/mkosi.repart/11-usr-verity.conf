# The dm-verity hash tree for the /usr partition.
#
# VerityMatchKey pairs this partition with the data partition that carries the
# same key. systemd-repart derives both partition UUIDs from the root hash, so
# the kernel can find this pair from the hash alone.

[Partition]
Type=usr-verity
Verity=hash
VerityMatchKey=usr
SizeMinBytes=128M
SizeMaxBytes=128M
