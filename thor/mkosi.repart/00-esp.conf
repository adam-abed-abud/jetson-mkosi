# The EFI system partition.
#
# This is the only partition the Thor's UEFI firmware looks at. It is a FAT
# filesystem, because that is the one filesystem UEFI is required to understand,
# and it holds the boot manager and the kernels:
#
#   EFI/BOOT/BOOTAA64.EFI          systemd-boot, under the name firmware looks
#                                  for when it is booting a disk it was not
#                                  explicitly told about
#   EFI/systemd/systemd-bootaa64.efi   the same program under its own name
#   EFI/Linux/*.efi                one unified kernel image per installed
#                                  kernel: kernel, initramfs and command line
#                                  in a single file
#   loader/                        systemd-boot's own configuration
#
# 1 GB is more than this image needs -- one unified kernel image is roughly
# 100 MB -- but it leaves room for a second one, which is what an A/B update
# scheme would want, and the space costs nothing on a device whose disk is
# measured in hundreds of gigabytes.

[Partition]
Type=esp
Format=vfat
CopyFiles=/boot:/
CopyFiles=/efi:/
SizeMinBytes=1G
SizeMaxBytes=1G
