# The Jetson AGX Thor image.
#
# mkosi reads this file, then every .conf file under mkosi.conf.d/, and it
# automatically picks up the directories named mkosi.skeleton/, mkosi.extra/,
# mkosi.sandbox/ and mkosi.repart/ that sit next to it. Each of those is
# explained where it is used.

[Distribution]
Distribution=ubuntu
Release=noble
# The Thor runs an aarch64 CPU. Building for it from an x86-64 CI runner works
# because the builder container registers an aarch64 emulator with the kernel.
Architecture=arm64
# Ubuntu splits its archive into components. mkosi enables main by default;
# universe is needed because that is where Canonical publishes the Jetson
# kernel (linux-image-*-nvidia-tegra).
Repositories=universe

[Output]
# The output format is set in mkosi.conf.d/50-disk.conf, next to the partition
# layout it depends on.
Output=jetson-thor
OutputDirectory=mkosi.output

[Build]
# Two caches, which mkosi keeps separately.
#
# mkosi.pkgcache holds the .deb files themselves, so that a rebuild does not
# download a few gigabytes from Canonical and NVIDIA again. This is the one that
# makes repeated builds quick. Without it mkosi uses a directory inside the
# build container, which is thrown away when the container exits.
PackageCacheDirectory=mkosi.pkgcache
# mkosi.cache holds the repositories' package lists -- the index apt consults to
# work out which version of a package to fetch.
CacheDirectory=mkosi.cache
