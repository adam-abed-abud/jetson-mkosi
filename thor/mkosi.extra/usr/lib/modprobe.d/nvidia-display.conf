# Options and load order for the GPU and display driver stack.
#
# This is a distillation of Canonical's nv-modprobe-openrm-l4t-display.conf. On
# a stock Jetson that file is copied into /etc at boot by a service called
# nv-load-display-modules.service; that service also runs 'depmod -a', which
# writes into /usr, and /usr is read-only here. So the service is switched off
# (see the post-installation script) and its configuration is shipped directly.
#
# The 'install' line is a small program the module loader runs instead of simply
# inserting nvidia.ko. It does three things in order:
#
#   1. Reads a power-gating mask that the platform leaves in a file under
#      /opt/nvidia, and hands it to the nv-gpu-static-pg module. Power gating
#      switches off parts of the GPU that this particular board does not have.
#      The file lists several masks on one line and nv-gpu-static-pg accepts
#      only one of them, so the grep picks out that one.
#   2. Loads nvidia.ko itself. --ignore-install is what stops this line from
#      calling itself recursively.
#   3. Loads nvidia-uvm, the unified-memory module CUDA needs, but only if step
#      2 succeeded. That '&&' is load-bearing, and the reason is not obvious.
#      nvidia-uvm depends on nvidia, so 'modprobe nvidia-uvm' resolves that
#      dependency and runs this very install line again. --ignore-install does
#      not help: it guards the direct call in step 2, not the re-entry through
#      dependency resolution. Normally the recursion stops on its own, because
#      step 2 has already loaded nvidia.ko and the dependency is satisfied. If
#      nvidia.ko fails to initialise -- no GPU, or a GPU the driver would not
#      claim -- nothing satisfies it, and modprobe recurses until the machine
#      runs out of processes. Guarding step 3 turns that into a clean failure:
#      one error, the service stops, and the console says what happened.
options nvidia-modeset disable_hdmi_frl=1 hdmi_deepcolor=0
options nvidia-drm modeset=1
install nvidia \
    gpu_pg_mask=$(grep -oE 'gpu_pg_mask_param=[^ ]+' /opt/nvidia/l4t-gpusetup/gpu_pg_mask 2>/dev/null); \
    /sbin/modprobe nv-gpu-static-pg ${gpu_pg_mask:+$gpu_pg_mask}; \
    /sbin/modprobe --ignore-install nvidia $CMDLINE_OPTS \
        && /sbin/modprobe nvidia-uvm
install nvgpu /bin/false
