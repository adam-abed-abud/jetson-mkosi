# Do not let udev load the GPU driver as soon as it sees the GPU.
#
# The problem this solves is a race. When the kernel enumerates the PCI bus it
# finds the GPU and announces it; udev matches the announcement against the
# nvidia and nvidia_drm modules and loads them straight away. On Thor that is
# too early -- parts of the platform the driver depends on are not up yet -- and
# the driver's probe fails. A failed probe is not retried, so the GPU stays
# dead for the rest of the boot.
#
# Blacklisting here suppresses only the automatic load. The driver is loaded
# deliberately, later, by nvidia-display-load.service.
blacklist nvidia
blacklist nvidia_drm
