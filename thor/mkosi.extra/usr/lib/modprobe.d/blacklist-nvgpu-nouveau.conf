# Keep the wrong GPU drivers out of the way.
#
# Thor's GPU is driven by NVIDIA's open kernel module, 'nvidia.ko', which the
# openrm packages provide. Two other drivers claim the same hardware: nvgpu,
# which is the driver for the older Orin generation, and nouveau, the community
# driver. The GPU's PCI identifier matches all three, so udev will happily
# autoload whichever it finds first, and if nvgpu wins it binds the GPU and the
# right driver can no longer have it.
#
# Blacklisting is how you tell the kernel's module loader not to consider them.
blacklist nvgpu
blacklist nouveau
