# Accounts that have to exist on a device whose /etc is created empty.
# Ubuntu creates these from package scripts writing to /etc/passwd, which this
# image does not ship, so they are declared here instead.

# NVIDIA's udev rules give the GPU's debug nodes to this group, and nothing in
# Ubuntu creates it.
g debug -

# Services whose Ubuntu packages create their user with adduser.
u sshd - "SSH privilege separation"
u avahi - "Avahi mDNS daemon"
u uuidd - "UUID daemon"
u dhcpcd - "DHCP client daemon"

# The operator account. Its password comes from a credential, not from here:
# sysusers.d has no password field, which is the design saying a baked-in
# password was always a development convenience.
u ubuntu - "Operator" /home/ubuntu /bin/bash
m ubuntu sudo
m ubuntu adm
m ubuntu dialout
m ubuntu video
# Without render, cuInit returns 801 from an unprivileged account, which reads
# as "operation not supported" and looks like a driver fault.
m ubuntu render
m ubuntu debug
