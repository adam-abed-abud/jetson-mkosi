# The writable partition, created on the device at first boot by
# systemd-repart running in the initrd. It holds /etc, /var and /home.
#
# No maximum size, so it grows to fill whatever drive the image is written to.
#
# The UUID is fixed because the kernel command line names the partition. On a
# first boot it does not exist yet when generators run, so discovery by
# partition type would find nothing; rootwait then waits for repart to create
# it. Revisit when A/B slots arrive, which want discovery instead.

[Partition]
Type=root
Format=ext4
Label=%M-root
UUID=0f7a9c1e-5b3d-4e8a-9c2f-6d1b4a7e3c50
SizeMinBytes=2G
MakeDirectories=/var/log/journal
FactoryReset=yes
