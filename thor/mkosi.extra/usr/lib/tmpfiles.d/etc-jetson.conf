# /etc starts empty on a device whose image carries only /usr. These lines link
# the paths that have to exist back to the vendor copies, so an update to /usr
# reaches /etc without anything being rewritten on the device.
#
# Symlinks, not copies, except where something writes to the path at runtime.
# Files that must differ per device -- SSH host keys, machine-id, passwd --
# are deliberately absent and get generated on first boot instead.

# PAM. Ubuntu ships these in /etc only; mkosi.postinst.chroot moves them.
L /etc/pam.d - - - - /usr/lib/pam.d

# Name resolution and the dynamic linker.
L /etc/nsswitch.conf
L /etc/ld.so.conf
L /etc/ld.so.conf.d
# Without the cache the linker searches only its default directories, so the
# NVIDIA libraries outside them stop resolving and CUDA fails.
L /etc/ld.so.cache
L /etc/ssl

# SSH. Individual files, so that /etc/ssh stays a real directory for the host
# keys sshd-keygen writes there.
L /etc/ssh/ssh_config
L /etc/ssh/ssh_config.d
L /etc/ssh/sshd_config
L /etc/ssh/sshd_config.d

# Services that refuse to start without their configuration.
L /etc/avahi
L /etc/dbus-1
L /etc/default/keyboard
L /etc/default/console-setup
# setupcon reads this whole tree, not just the defaults file.
L /etc/console-setup
L /etc/default/locale

# Shell environment and locale.
L /etc/locale.conf
L /etc/profile
L /etc/profile.d
L /etc/bash.bashrc
L /etc/environment
L /etc/security
L /etc/inputrc

# Hosts, and the fstab placeholder that stops NVIDIA's version being used.
L /etc/hosts
L /etc/fstab

# sudo, including the rule for the operator account.
L /etc/sudoers
L /etc/sudoers.d

# NVIDIA installs outside /usr. The tree moved into /usr at build time; this
# keeps the path anything hardcoding /opt/nvidia expects.
d /opt 0755 root root -
L /opt/nvidia - - - - /usr/lib/nvidia-opt

# dpkg database, so dpkg -l and dpkg -S keep working.
L /var/lib/dpkg

# Camera tuning data. Copied, because nvargus writes into these directories.
C /var/nvidia - - - -

# Home for the operator account; sysusers declares the user but not this.
d /home/ubuntu 0750 ubuntu ubuntu -
