# Directories the NVIDIA daemons need but do not create for themselves.
#
# nvfancontrol keeps its state under /var/lib/nvfancontrol. Its package ships no
# such directory and its unit file does not declare StateDirectory=, so on a
# fresh image the daemon starts, fails to write, and exits. systemd-tmpfiles
# creates the directory at boot. The fields are: type, path, mode, owner, group,
# age ('-' meaning never clean it up).
d /var/lib/nvfancontrol 0755 root root -
