# How the image boots.
#
# The chain is: Thor's UEFI firmware finds the EFI system partition on the disk
# and runs \EFI\BOOT\BOOTAA64.EFI, which is systemd-boot. systemd-boot lists the
# unified kernel images in \EFI\Linux and starts one. A unified kernel image is
# a single EFI executable with the kernel, the initramfs and the kernel command
# line built into it, which is why the command line is set here at build time
# and cannot be edited on the device.

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned

# --- the kernel command line -------------------------------------------------
#
# The four platform options below are not optional and the image will not work
# without them. They are normally supplied by the device tree: NVIDIA's firmware
# hands the kernel a device tree whose /chosen/bootargs node carries them. But
# when the kernel is started as an EFI application, its EFI stub overwrites
# /chosen/bootargs with the command line it was given, so anything that was in
# the device tree is lost unless it is repeated here.
#
# They were read out of NVIDIA's own Thor device trees, in the
# nvidia-l4t-kernel-dtbs package for r39.2, which is the authoritative source
# for what a stock Thor boots with:
#
#   nvme.use_threaded_interrupts=1   Handle NVMe completions in a kernel thread
#                                    rather than in interrupt context. Tegra's
#                                    NVMe controller needs this.
#   tegra_keep_boot_clocks           Do not switch off clocks that the boot
#                                    firmware left running. Some of them belong
#                                    to hardware whose driver has not loaded yet.
#   clk_ignore_unused                The generic version of the same idea: do
#                                    not disable clocks that no driver claims.
#   pci=pcie_bus_perf                Tune PCIe payload sizes for throughput.
#
# The consoles: tty0 is whatever display is attached, ttyUTC0 is Thor's debug
# serial port, and ttyAMA0 is there for the emulator (see below). Note the
# spelling of the Thor one. Orin's equivalent is ttyTCU0, for "Tegra
# Combined UART"; on Thor the device really is called ttyUTC0, which looks like
# a typo of the Orin name but is not -- it is what NVIDIA's own Thor device
# trees say.
#
# There is deliberately no earlycon here, and that is worth explaining because
# the obvious thing to do is to add one.
#
# An earlycon prints kernel messages from the first moments of boot, before the
# real serial driver has loaded, and NVIDIA's own Thor boot arguments set
# 'earlycon=tegra_utc,mmio32,0xc4e0000'. Adding it looked like free insurance.
# It is not. That argument tells the kernel a physical address to write
# characters to, before it knows anything about the machine it is on. On a Thor
# the address is right. On anything else it is not, and writing to an address
# that has no device behind it faults the kernel dead before any console
# exists -- so the symptom is total silence, which is exactly the symptom the
# earlycon was supposed to prevent.
#
# This was not reasoned out, it was observed. On an emulated arm64 machine this
# kernel produces no output whatsoever with that argument, and boots normally
# with it removed and nothing else changed. Carrying it would mean the image
# could only ever be tested on the hardware it is meant to de-risk.
#
# If a Thor ever does die before the real console comes up, build a one-off
# image with it rather than shipping it:
#
#   just build --kernel-command-line="earlycon=tegra_utc,mmio32,0xc4e0000"
#
# The real console is ttyUTC0 and it comes up within a second or two of the
# kernel starting. Canonical's kernel configuration file does not mention that
# device under any searchable name, which makes it look as though the driver
# might be missing. It is not: the strings 'ttyUTC' and 'tegra_utc' are both in
# the kernel binary of 6.8.0-1035-nvidia-tegra, and scripts/verify.sh checks
# that on every build.
#
# There is no root partition in the image. mkosi puts usrhash= here by itself,
# derived from the verity hash tree, and systemd finds both /usr partitions from
# it. The root partition is created on the device at first boot; see
# mkosi.extra/usr/lib/repart.d/50-root.conf for why it is named by UUID.
KernelCommandLine=
        root=PARTUUID=0f7a9c1e-5b3d-4e8a-9c2f-6d1b4a7e3c50
        mount.usr=/dev/mapper/usr
        # No interactive wizard on a headless board. No account has a
        # password: root stays locked, ubuntu logs in by SSH key from the
        # ESP, and recovery is the passwordless emergency shell. The
        # emulator recipes inject a password over SMBIOS for console use.
        systemd.firstboot=off
        rw
        rootwait
        nvme.use_threaded_interrupts=1
        tegra_keep_boot_clocks
        clk_ignore_unused
        pci=pcie_bus_perf
        console=tty0
        console=ttyUTC0,115200
        # ttyAMA0 is the serial port of QEMU's generic arm64 machine, which is
        # what scripts/qemu-boot.sh starts this image on. A Thor has no such
        # port, so on a Thor this console never registers and the line does
        # nothing: the kernel only uses the consoles it can actually find, and
        # systemd only puts a login prompt on those. Carrying it means the image
        # that gets flashed is the same one that was test-booted, rather than a
        # near-identical build.
        console=ttyAMA0,115200

# --- what goes in the initramfs ----------------------------------------------
#
# The initramfs is the small filesystem the kernel unpacks into memory before it
# can reach the real one. It needs exactly the drivers required to get from
# "the kernel is running" to "the root filesystem is mounted", and no more.
#
# 'default' is mkosi's own list, which covers the generic cases: NVMe, ext4, USB
# storage and so on. Everything after it is Tegra-specific, from drivers that
# are built out of tree and that no generic list would know about. Without
# pcie-tegra264 in particular the kernel starts, finds no PCIe bus, finds no
# NVMe disk, and stops with nothing to mount.
#
# The Tegra half of this list is not hand-picked. Canonical ships its own answer
# to the question in the kernel module package, as an initramfs-tools
# configuration file:
#
#   /usr/share/initramfs-tools/modules.d/tegra-oot-jetson-defaults_nvidia-tegra.conf
#
# That file is inert here, because initramfs-tools is not installed, but it is
# the vendor's list and it is what is copied below. It is a superset of the six
# drivers bootc-jetson gives to dracut; the seven extra entries are three
# Ethernet drivers, the USB-C port controller, the USB device controller, a
# crash-dump companion to the virtual block device, and the trusted execution
# environment driver. Including them costs a few hundred kilobytes and means an
# initramfs that can also bring up a network, which is useful on a board that
# will not boot.
#
# If the kernel package is ever bumped, that file is the thing to re-read.
KernelInitrdModules=
        default
        pcie-tegra264       # PCIe host controller -- the NVMe disk hangs off it
        ufs-tegra           # the other storage controller, for UFS-based boards
        tegra_vblk          # virtual block device, for virtualised setups
        tegra_hv_vblk_oops  #   and its crash-dump companion
        nvethernet          # Tegra's own Ethernet controller
        r8168               # Realtek Ethernet, used on some carrier boards
        r8126               #   and its newer sibling
        fusb301             # USB-C port controller
        tegra-xudc          # Tegra USB device controller
        pwm-fan             # fan control, so the board does not overheat while
        pwm-tegra           #   it is still in the initramfs
        tegra-bpmp-thermal  # temperature sensors, same reason
        tee                 # trusted execution environment, used for key access
