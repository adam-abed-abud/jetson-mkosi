# The ordinary Ubuntu userland: enough to boot, get on the network, and let
# somebody log in. Nothing here is Jetson-specific.
#
# This mirrors bootc-jetson's package list with its bootc- and ostree-specific
# entries left out -- bootc, podman, skopeo and bubblewrap are there to let the
# device pull and deploy new container images, which is the update mechanism
# this proof of concept deliberately does not cover.

[Content]
Packages=
        # The base set Ubuntu considers a minimal system.
        ubuntu-minimal
        systemd
        systemd-resolved
        systemd-timesyncd

        # systemd-boot-efi carries the aarch64 EFI binaries -- the boot manager
        # itself and the stub that unified kernel images are built around.
        # mkosi copies them out of the image when it populates the EFI system
        # partition, so they have to be installed even though nothing on the
        # running system uses them. The systemd-boot package proper is not
        # installed: its install hooks want to manage a live machine's ESP.
        systemd-boot-efi

        # Remote access and name resolution on a bench network. avahi plus
        # libnss-mdns let the board answer to <hostname>.local, which saves
        # hunting for its address in the DHCP server.
        openssh-server
        avahi-daemon
        libnss-mdns
        libnss-systemd

        # Enough tooling to diagnose the device over a serial console.
        efibootmgr
        dosfstools
        e2fsprogs
        fdisk
        less

# A fixed hostname, so the board is reachable as jetson-thor.local over mDNS
# without first finding its address. Change it per device if you run more than
# one on the same network.
Hostname=jetson-thor

# The machine identifier is deliberately left empty, which is what mkosi does by
# default: systemd generates a fresh one the first time each device boots. An
# image is written to many devices, and they must not share one.

# The language and formatting settings. C.UTF-8 is the one locale glibc carries
# built in, so it always works without a locale database having been generated.
# For a machine running control software that is also the right choice on its
# merits: a locale decides how numbers and dates are formatted and how text
# sorts, and a robot should do those the same way everywhere rather than
# differently depending on which country its image was built in.
#
# This has to be set because one of NVIDIA's packages writes en_US.UTF-8 into
# the image's locale configuration, and that locale is not generated here, so
# every login and every program that asks for it would print a warning about
# being unable to set the locale. See also mkosi.extra/etc/default/locale, which
# covers the second file that has to agree.
Locale=C.UTF-8
