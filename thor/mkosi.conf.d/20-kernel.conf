# The kernel.
#
# This is Canonical's Jetson kernel, not NVIDIA's. Canonical builds a 6.8
# kernel with the 'nvidia-tegra' flavour and publishes it in Ubuntu's universe
# component, together with the out-of-tree Tegra drivers as separate module
# packages. Using it rather than NVIDIA's nvidia-l4t-kernel is what makes this a
# normal Ubuntu system: the kernel is an ordinary package from the ordinary
# archive.
#
# The version is pinned to an exact ABI. '6.8.0-1035' is one specific kernel
# build; a newer one, 1036, exists at the time of writing. Pinning matters
# because the three module packages below only install against the matching
# kernel, and because an unpinned build would silently change kernels between CI
# runs. Bumping it is a deliberate edit of this file.

[Content]
Packages=
        linux-image-6.8.0-1035-nvidia-tegra
        linux-modules-extra-6.8.0-1035-nvidia-tegra
        # The out-of-tree Tegra drivers: the PCIe controller, the storage
        # controller, the fan and thermal drivers, and so on. Without these the
        # kernel boots but cannot see the NVMe disk it is supposed to be
        # running from.
        linux-modules-tegra-oot-jetson-6.8.0-1035-nvidia-tegra
        # The GPU kernel driver. Thor's GPU is driven by 'openrm', NVIDIA's
        # open kernel module; Orin uses the older 'nvgpu' driver instead. This
        # choice has to agree with the nvidia-l4t-*-openrm userspace packages.
        linux-modules-tegra-igpu-openrm-jetson-6.8.0-1035-nvidia-tegra
