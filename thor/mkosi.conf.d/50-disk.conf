# Produce a disk image rather than a directory tree.
#
# The result is a single file with a GPT partition table, the EFI system
# partition and the root filesystem inside it -- the same thing you would get by
# reading back a correctly installed SSD. Writing it to a device is a plain
# byte-for-byte copy; see scripts/flash.sh.
#
# The partitions themselves are defined in mkosi.repart/, which mkosi picks up
# automatically and hands to systemd-repart.

[Output]
Format=disk
