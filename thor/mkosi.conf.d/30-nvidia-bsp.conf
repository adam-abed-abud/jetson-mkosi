# NVIDIA's board support package for Thor.
#
# These are the packages from the 'som' and 'common' repositories configured in
# mkosi.sandbox/. The list is bootc-jetson's, which was established on real Thor
# hardware, so it is reproduced rather than re-derived.
#
# The thing to know when reading it: several of these packages come in two
# flavours, '-openrm' and '-nvgpu', and they are not interchangeable. They are
# the userspace halves of the two GPU kernel drivers. Thor's GPU is driven by
# openrm; Orin's by nvgpu. Picking the wrong one gives an image where the GPU
# kernel module loads but no CUDA program can talk to it. Every '-openrm' below
# would be '-nvgpu' in an Orin image.

[Content]
Packages=
        # The core of the BSP: shared libraries that nearly everything else in
        # the list links against, and the boot-time setup NVIDIA expects.
        nvidia-l4t-core
        nvidia-l4t-init
        nvidia-l4t-firmware
        nvidia-l4t-firmware-openrm

        # The bootloader payload. Installing this is what needs the
        # 'do not flash the firmware' flag dropped in mkosi.skeleton/; see the
        # file there for why.
        nvidia-l4t-bootloader

        # GPU compute. nvidia-l4t-cuda-openrm is the CUDA driver -- libcuda,
        # the library a CUDA program actually calls -- not the CUDA toolkit.
        # nvml is the management library that nvidia-smi-style tools use.
        nvidia-l4t-cuda-openrm
        nvidia-l4t-nvml
        nvidia-l4t-nvsci

        # Graphics and display: OpenGL ES, the buffer allocator Wayland and
        # friends use, and Vulkan.
        nvidia-l4t-3d-core
        nvidia-l4t-gbm

        # Cameras, video encode and decode, and the programmable vision
        # accelerator. Kept because a robotics payload will want them.
        nvidia-l4t-camera
        nvidia-l4t-multimedia
        nvidia-l4t-multimedia-utils
        nvidia-l4t-gstreamer
        nvidia-l4t-pva

        # Power and thermal management, and NVIDIA's own diagnostic tools
        # (tegrastats, nvbootctrl, and so on).
        nvidia-l4t-nvpmodel
        nvidia-l4t-nvfancontrol
        nvidia-l4t-tools
